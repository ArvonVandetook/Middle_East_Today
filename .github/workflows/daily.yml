name: Daily Briefing Update

on:
  schedule:
    - cron: "0 13 * * *"  # 6am Pacific (adjust if needed)
  workflow_dispatch:       # allows manual run

jobs:
  update-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install requests beautifulsoup4 feedparser openai playwright
          python3 -m pip playwright install --with-deps

      - name: Run briefing generator
        run: |
          python3 generate_briefing.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add public/briefing.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily briefing update"
            git push
          fi
