name: Daily Briefing Update

on:
  schedule:
    - cron: "0 10,22 * * *"  
  workflow_dispatch:       # allows manual run

jobs:
  update-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install requests beautifulsoup4 feedparser openai playwright lxml
          python3 -m playwright install chromium

      - name: Run briefing generator
        env: 
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 generate_briefing.py
          		
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add public/briefing.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily briefing update"
            git push
          fi
